# Self-host Kids Economy on any machine with Docker (provider-agnostic, ADR-0014):
#   $env.POSTGRES_PASSWORD = (random chars --length 32)   # nushell
#   docker compose up -d
# Then open http://localhost:8080. Put HTTPS in front with your own reverse proxy;
# Sign-in cookies are Secure, so browsers only keep them over HTTPS or on localhost.
services:
  app:
    image: ghcr.io/jonaskac/kids-economy:${KIDS_ECONOMY_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://kids:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/kids_economy
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kids_economy
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kids -d kids_economy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
