[workspace]
resolver = "2"
members = ["crates/domain", "crates/store", "crates/http", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tempfile = "3"
url = "2"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
uuid = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "uuid", "time"] }
tracing = "0.1"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

domain = { path = "crates/domain" }
store = { path = "crates/store" }
kids-http = { path = "crates/http" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
